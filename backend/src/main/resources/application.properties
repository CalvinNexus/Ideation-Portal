quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ura_ideation}
quarkus.datasource.username=${POSTGRES_USER:ura_app}
quarkus.datasource.password=${POSTGRES_PASSWORD:change-me}
quarkus.flyway.migrate-at-start=true
quarkus.swagger-ui.always-include=true
